name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none
  push:
    branches: [main]
    paths:
      - "package.json"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          LOCAL=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          PUBLISHED=$(bun pm view @crafter/li-metrics version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "Local version $LOCAL has not been published yet"
            exit 1
          fi
          NEXT=$(bun -e 'const [version,bump]=Bun.argv.slice(1); const [major,minor,patch]=version.split(".").map(Number); console.log(bump==="major"?`${major+1}.0.0`:bump==="minor"?`${major}.${minor+1}.0`:`${major}.${minor}.${patch+1}`)' "$LOCAL" "$BUMP")
          bun pm pkg set "version=$NEXT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$NEXT"
          git push

  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bump == 'none')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Detect version change
        id: version
        run: |
          LOCAL=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          PUBLISHED=$(npm view @crafter/li-metrics version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: $PUBLISHED -> $LOCAL"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged ($LOCAL), skipping publish"
          fi

      - name: Install
        if: steps.version.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Verify
        if: steps.version.outputs.changed == 'true'
        run: bun run release:check

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        run: npm publish --access public

      - name: GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
