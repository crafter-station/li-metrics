name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: [1.3.11, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bun run test:coverage
      - run: bun pm pack --dry-run

  consumer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun pm pack --destination "$RUNNER_TEMP"
      - run: mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer" && bun init -y && bun add "$RUNNER_TEMP"/crafter-li-metrics-*.tgz && ./node_modules/.bin/li-metrics --json schema post.metrics
